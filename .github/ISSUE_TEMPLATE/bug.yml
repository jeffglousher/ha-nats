name: Bug report
description: Report a reproducible app problem without secrets
body:
  - type: markdown
    attributes:
      value: Do not include tokens, passwords, private messages or ingress URLs. Report vulnerabilities privately.
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: HA OS version and architecture
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized log lines
      render: text
