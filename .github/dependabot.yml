version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same CodeQL Action release.
      codeql-action:
        patterns:
          - github/codeql-action/*
  - package-ecosystem: docker
    directory: /pbscar_nats
    schedule:
      interval: weekly
