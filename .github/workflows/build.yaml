name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release metadata
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 tools/check_release.py
          sh -n pbscar_nats/run.sh
      - name: Build and run isolated runtime tests
        run: docker build --build-arg BUILD_VERSION=ci --build-arg BUILD_ARCH=${{ matrix.arch }} -t addon-test ./pbscar_nats
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: addon-test
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check publication privacy
        run: python3 tools/check_privacy.py
      - name: Scan secrets with verified Gitleaks
        env:
          SCANNER_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  gitleaks.tar.gz\n' "$SCANNER_SHA256" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --redact --log-opts=--all --ignore-gitleaks-allow --max-decode-depth 5
          "$RUNNER_TEMP/gitleaks" dir . --redact --ignore-gitleaks-allow --max-decode-depth 5 --max-archive-depth 3
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate workflows and embedded shell
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check app shell scripts
        run: shellcheck pbscar_nats/run.sh
