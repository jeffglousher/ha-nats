name: NATS
version: 0.6.1
slug: pbscar_nats
description: NATS messaging with persistent JetStream, TLS and client permissions
  configured in Home Assistant.
arch:
- amd64
- aarch64
startup: services
boot: auto
backup: cold
init: false
map:
- type: ssl
  read_only: true
ports:
  4222/tcp: 4222
ports_description:
  4222/tcp: Authenticated NATS clients
watchdog: tcp://[HOST]:[PORT:4222]
options:
  auth_mode: token
  token: ''
  users: []
  tls: false
  cert_file: fullchain.pem
  key_file: privkey.pem
  client_ca: ''
  verify_clients: false
  file_gb: 5
  memory_mb: 64
  max_connections: 1024
  max_payload_kb: 1024
  provision_nui: true
schema:
  auth_mode: list(token|users)
  token: password
  users:
  - name: str
    password: password
    publish:
    - str
    subscribe:
    - str
  tls: bool
  cert_file: str
  key_file: str
  client_ca: str
  verify_clients: bool
  file_gb: int(1,1024)
  memory_mb: int(16,4096)
  max_connections: int(1,65536)
  max_payload_kb: int(1,8192)
  provision_nui: bool
url: https://github.com/jeffglousher/ha-nats
hassio_api: true
hassio_role: default
