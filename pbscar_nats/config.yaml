name: NATS
version: "0.5.0"
slug: pbscar_nats
description: NATS messaging with local TLS, client permissions, persistent JetStream and an HA settings console.
arch:
  - amd64
  - aarch64
startup: services
boot: auto
backup: cold
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:server-security
panel_title: NATS
panel_admin: true
map:
  - type: ssl
    read_only: true
ports:
  4222/tcp: 4222
ports_description:
  4222/tcp: Authenticated NATS clients
watchdog: tcp://[HOST]:[PORT:4222]
options:
  token: ""
  restore_mode: false
schema:
  token: password
  restore_mode: bool
url: https://github.com/jeffglousher/ha-nats
